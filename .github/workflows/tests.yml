name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    name: Regresión (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Versiones instaladas
        run: python -m pip list | grep -Ei "streamlit|pandas|numpy|scikit|plotly"

      - name: Ejecutar la suite
        run: python -m unittest discover -s tests -v
